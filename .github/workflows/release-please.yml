name: Release Please

on:
  push:
    branches:
      - main

permissions:
  contents: write
  pull-requests: write
  id-token: write

jobs:
  release-please:
    runs-on: ubuntu-latest
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Release Please
        uses: googleapis/release-please-action@v4
        id: release
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          release-type: node

  publish:
    needs: release-please
    runs-on: ubuntu-latest
    if: ${{ needs.release-please.outputs.release_created }}
    permissions:
      contents: read
      id-token: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Setup Node.js with OIDC
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          registry-url: 'https://registry.npmjs.org'
          # OIDC 認證：setup-node@v4 會自動使用 GITHUB_TOKEN 的 OIDC token
          # 前提條件：
          # 1. npm 帳號必須是套件的 owner（已確認：carllee1983）
          # 2. npm 帳號需要啟用 OIDC 可信發布功能
          # 3. permissions.id-token: write 已設定（已設定）

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Run tests
        run: bun run test:ci

      - name: Build
        run: bun run build

      - name: Verify npm authentication
        run: |
          echo "Verifying npm authentication..."
          npm whoami --registry=https://registry.npmjs.org || echo "⚠️ Authentication check failed"

      - name: Publish to npm with OIDC
        run: npm publish --access public --provenance
        # 使用 OIDC 認證，setup-node 會自動處理認證
        # 如果失敗，請確認：
        # 1. npm 帳號已啟用 OIDC（見 .github/OIDC_SETUP.md）
        # 2. 套件 owner 權限正確
        # 3. GitHub Actions 的 id-token 權限已設定
