name: Release Please

on:
  push:
    branches:
      - main

permissions:
  contents: write
  pull-requests: write

jobs:
  release-please:
    runs-on: ubuntu-latest
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Release Please
        uses: googleapis/release-please-action@v4
        id: release
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          release-type: node

  publish:
    needs: release-please
    runs-on: ubuntu-latest
    if: ${{ needs.release-please.outputs.release_created }}
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          registry-url: 'https://registry.npmjs.org'
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        # 使用 NPM_TOKEN secret 進行認證
        # 需要在 GitHub repository settings 中設定 NPM_TOKEN secret
        # 取得方式：npm 網站 → Access Tokens → Generate New Token (Automation)

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Run tests
        run: bun run test:ci

      - name: Build
        run: bun run build

      - name: Verify npm authentication
        run: |
          echo "Verifying npm authentication..."
          echo "Registry: $(npm config get registry)"
          npm whoami --registry=https://registry.npmjs.org || (echo "⚠️ Authentication check failed - Please check NPM_TOKEN secret" && exit 1)

      - name: Publish to npm
        run: |
          echo "Publishing to npm..."
          echo "Package: $(node -p "require('./package.json').name")"
          echo "Version: $(node -p "require('./package.json').version")"
          npm publish --access public
        # 使用 NPM_TOKEN secret 進行認證
        # 如果失敗，請確認：
        # 1. GitHub repository settings 中已設定 NPM_TOKEN secret
        # 2. NPM_TOKEN 是有效的 Automation token
        # 3. npm 帳號是套件的 owner
